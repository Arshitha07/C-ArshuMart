<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - ArshuMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            color: #25213a;
            min-height: 100vh;

            background:
                radial-gradient(circle at 8% 10%,
                    rgba(236, 72, 153, 0.20),
                    transparent 28%),

                radial-gradient(circle at 92% 12%,
                    rgba(13, 148, 136, 0.20),
                    transparent 30%),

                radial-gradient(circle at 15% 88%,
                    rgba(249, 115, 22, 0.16),
                    transparent 28%),

                radial-gradient(circle at 88% 88%,
                    rgba(124, 58, 237, 0.18),
                    transparent 30%),

                linear-gradient(
                    135deg,
                    #fff7fb,
                    #f8f7ff,
                    #f1fffd
                );
        }

        /* ================= HEADER ================= */

        .topbar {
            min-height: 82px;
            padding: 18px 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                linear-gradient(
                    110deg,
                    #5b21b6,
                    #7c3aed,
                    #db2777,
                    #f97316
                );

            color: white;

            box-shadow:
                0 10px 30px rgba(91, 33, 182, 0.22);
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .brand span {
            color: #fde68a;
        }

        .back-btn {
            color: white;
            text-decoration: none;

            padding: 10px 18px;

            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 999px;

            background: rgba(255,255,255,0.14);

            backdrop-filter: blur(8px);

            font-weight: 600;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* ================= MAIN ================= */

        .page {
            width: min(1180px, 92%);
            margin: 42px auto 60px;
        }

        /* ================= HERO ================= */

        .hero {
            position: relative;
            overflow: hidden;

            border-radius: 28px;

            padding: 38px;

            color: white;

            background:
                linear-gradient(
                    120deg,
                    #312e81,
                    #7c3aed 42%,
                    #c026d3 72%,
                    #db2777
                );

            box-shadow:
                0 22px 50px rgba(124,58,237,0.20);

            margin-bottom: 28px;
        }

        .hero::after {
            content: "";

            position: absolute;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            right: -60px;
            top: -100px;

            background:
                rgba(250,204,21,0.25);
        }

        .eyebrow {
            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 2px;

            font-weight: 700;

            opacity: 0.82;

            margin-bottom: 8px;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 52px);

            margin-bottom: 8px;
        }

        .hero p {
            opacity: 0.88;

            font-size: 16px;
        }

        .count {
            display: inline-block;

            margin-top: 20px;

            padding: 9px 15px;

            border-radius: 999px;

            background: rgba(255,255,255,0.16);

            border:
                1px solid rgba(255,255,255,0.25);

            font-weight: 700;
        }

        /* ================= ORDERS ================= */

        #ordersList {
            display: grid;
            gap: 24px;
        }

        .order-card {
            background: rgba(255,255,255,0.93);

            border:
                1px solid rgba(124,58,237,0.12);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 14px 38px rgba(44,32,80,0.10);

            backdrop-filter: blur(10px);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .order-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 20px 45px rgba(44,32,80,0.15);
        }

        /* ================= ORDER HEADER ================= */

        .order-head {
            padding: 20px 24px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            background:
                linear-gradient(
                    90deg,
                    #faf5ff,
                    #fff1f2,
                    #f0fdfa
                );

            border-bottom:
                1px solid rgba(124,58,237,0.08);
        }

        .order-number {
            font-weight: 800;

            font-size: 18px;
        }

        .order-date {
            color: #706b80;

            font-size: 14px;

            margin-top: 5px;
        }

        /* ================= STATUS ================= */

        .status {
            padding: 8px 14px;

            border-radius: 999px;

            font-size: 13px;

            font-weight: 800;

            background: #dcfce7;

            color: #15803d;
        }

        /* ================= ITEMS ================= */

        .items {
            padding: 22px 24px;

            display: grid;

            gap: 16px;
        }

        .item {
            display: grid;

            grid-template-columns:
                92px 1fr auto;

            align-items: center;

            gap: 18px;

            padding: 14px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #faf7ff
                );

            border:
                1px solid #eee8ff;
        }

        /* ================= PRODUCT IMAGE ================= */

        .product-image {
            width: 92px;
            height: 92px;

            object-fit: cover;

            border-radius: 16px;

            background: #f3f4f6;

            border:
                1px solid #e5e7eb;

            box-shadow:
                0 6px 15px rgba(0,0,0,0.06);
        }

        /* ================= PRODUCT DETAILS ================= */

        .product-name {
            font-weight: 800;

            font-size: 17px;

            margin-bottom: 8px;

            color: #3b0764;
        }

        .item-info {
            color: #706b80;

            font-size: 14px;

            line-height: 1.7;
        }

        .item-price {
            font-size: 17px;

            font-weight: 800;

            color: #7c3aed;

            white-space: nowrap;
        }

        /* ================= FOOTER ================= */

        .order-footer {
            padding: 20px 24px;

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 14px;

            background:
                linear-gradient(
                    90deg,
                    #fff7ed,
                    #fdf4ff,
                    #ecfeff
                );

            border-top:
                1px solid rgba(124,58,237,0.08);
        }

        .total-label {
            color: #706b80;

            font-size: 14px;
        }

        .total {
            font-size: 25px;

            font-weight: 900;

            color: #c026d3;
        }

        /* ================= SHOP BUTTON ================= */

        .shop-btn {
            text-decoration: none;

            color: white;

            font-weight: 800;

            padding: 11px 18px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #0d9488,
                    #06b6d4
                );

            box-shadow:
                0 8px 18px rgba(13,148,136,0.20);

            transition: 0.2s;
        }

        .shop-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 22px rgba(13,148,136,0.28);
        }

        /* ================= MESSAGE ================= */

        .message {
            background:
                rgba(255,255,255,0.92);

            border-radius: 22px;

            padding: 45px;

            text-align: center;

            color: #706b80;

            box-shadow:
                0 14px 38px rgba(44,32,80,0.08);
        }

        .message h2 {
            color: #5b21b6;

            margin-bottom: 8px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .topbar {
                padding: 16px 4%;
            }

            .brand {
                font-size: 23px;
            }

            .page {
                width: 94%;

                margin-top: 25px;
            }

            .hero {
                padding: 28px 22px;

                border-radius: 22px;
            }

            .order-head,
            .order-footer {
                padding: 17px;
            }

            .items {
                padding: 17px;
            }

            .item {
                grid-template-columns:
                    70px 1fr;
            }

            .product-image {
                width: 70px;
                height: 70px;
            }

            .item-price {
                grid-column: 2;
            }

            .order-footer {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="topbar">

        <div class="brand">
            Arshu<span>Mart</span>
        </div>

        <a
            class="back-btn"
            href="products.html"
        >
            Continue Shopping
        </a>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="page">

        <!-- HERO -->

        <section class="hero">

            <div class="eyebrow">
                Your Shopping Journey
            </div>

            <h1>
                My Orders
            </h1>

            <p>
                Everything you have ordered,
                neatly organized in one place.
            </p>

            <div
                class="count"
                id="orderCount"
            >
                Loading orders...
            </div>

        </section>


        <!-- ORDERS -->

        <section id="ordersList">

            <div class="message">
                Loading your orders...
            </div>

        </section>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const userData =
            JSON.parse(
                localStorage.getItem("arshuMartUser")
            );

        const userId =
            userData
                ? userData.id
                : null;


        const ordersList =
            document.getElementById("ordersList");

        const orderCount =
            document.getElementById("orderCount");


        /* ================= FALLBACK IMAGE ================= */

        function fallbackImage(productId) {

            return `https://picsum.photos/seed/arshumart-order-${productId}/800/600`;

        }


        /* ================= DATE ================= */

        function getOrderDate(dateValue) {
    if (!dateValue) {
        return null;
    }

    const utcValue = dateValue.replace(" ", "T") + "Z";
    const date = new Date(utcValue);

    if (isNaN(date.getTime())) {
        return null;
    }

    return date;
}


function formatDate(dateValue) {
    const date = getOrderDate(dateValue);

    if (!date) {
        return "Date unavailable";
    }

    return new Intl.DateTimeFormat("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "short",
        year: "numeric"
    }).format(date);
}


        /* ================= TIME ================= */

        function formatTime(dateValue) {
    if (!dateValue) {
        return "";
    }

    // SQLite CURRENT_TIMESTAMP is UTC
    const utcValue = dateValue.replace(" ", "T") + "Z";
    const date = new Date(utcValue);

    if (isNaN(date.getTime())) {
        return "";
    }

    // Convert directly to India Standard Time
    return new Intl.DateTimeFormat("en-IN", {
        timeZone: "Asia/Kolkata",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    }).format(date);
}


        /* ================= LOGIN CHECK ================= */

        if (!userId) {

            orderCount.textContent =
                "Login required";

            ordersList.innerHTML = `

                <div class="message">

                    <h2>
                        Please Login
                    </h2>

                    <p>
                        You need to login
                        to view your orders.
                    </p>

                </div>

            `;

        }

        else {

            /* ================= FETCH ORDERS ================= */

            fetch(
                `http://127.0.0.1:8080/api/orders?buyerId=${userId}`
            )

            .then(response =>
                response.json()
            )

            .then(data => {

                /* ================= NO ORDERS ================= */

                if (
                    !data.success ||
                    !data.orders ||
                    data.orders.length === 0
                ) {

                    orderCount.textContent =
                        "0 orders";

                    ordersList.innerHTML = `

                        <div class="message">

                            <h2>
                                No Orders Yet
                            </h2>

                            <p>
                                Your completed orders
                                will appear here.
                            </p>

                        </div>

                    `;

                    return;

                }


                /* ================= ORDER COUNT ================= */

                orderCount.textContent =
                    `${data.orders.length}
                    ${data.orders.length === 1
                        ? "order"
                        : "orders"}`;


                ordersList.innerHTML = "";


                /* ================= EACH ORDER ================= */

                data.orders.forEach(order => {

                    const orderBox =
                        document.createElement("article");

                    orderBox.className =
                        "order-card";


                    const items =
                        Array.isArray(order.items)
                            ? order.items
                            : [];


                    let itemsHTML = "";


                    /* ================= ITEMS ================= */

                    if (items.length === 0) {

                        itemsHTML = `

                            <div class="message">

                                Product details
                                are not available
                                for this order.

                            </div>

                        `;

                    }

                    else {

                        itemsHTML =
                            items.map(item => {

                                const image =
                                    item.image &&
                                    item.image.trim() !== ""
                                        ? item.image
                                        : fallbackImage(
                                            item.productId
                                        );


                                const quantity =
                                    Number(
                                        item.quantity || 0
                                    );


                                const price =
                                    Number(
                                        item.price || 0
                                    );


                                const itemTotal =
                                    price * quantity;


                                return `

                                    <div class="item">

                                        <img
                                            class="product-image"
                                            src="${image}"
                                            alt="${item.name || "Product"}"

                                            onerror="
                                                this.onerror=null;
                                                this.src='${fallbackImage(item.productId)}';
                                            "
                                        >


                                        <div>

                                            <div class="product-name">

                                                ${item.name || "Product"}

                                            </div>


                                            <div class="item-info">

                                                Quantity:
                                                ${quantity}

                                                <br>

                                                Unit Price:
                                                ₹${price.toFixed(2)}

                                            </div>

                                        </div>


                                        <div class="item-price">

                                            ₹${itemTotal.toFixed(2)}

                                        </div>

                                    </div>

                                `;

                            }).join("");

                    }


                    /* ================= ORDER HTML ================= */

                    orderBox.innerHTML = `

                        <div class="order-head">

                            <div>

                                <div class="order-number">

                                    Order #${order.id}

                                </div>


                                <div class="order-date">

                                    ${formatDate(order.createdAt)}

                                    ${
                                        formatTime(order.createdAt)
                                            ? " • " +
                                              formatTime(order.createdAt)
                                            : ""
                                    }

                                </div>

                            </div>


                            <div class="status">

                                ${order.status || "Pending"}

                            </div>

                        </div>


                        <div class="items">

                            ${itemsHTML}

                        </div>


                        <div class="order-footer">

                            <div>

                                <div class="total-label">

                                    Order Total

                                </div>


                                <div class="total">

                                    ₹${Number(
                                        order.totalAmount || 0
                                    ).toFixed(2)}

                                </div>

                            </div>


                            <a
                                class="shop-btn"
                                href="products.html"
                            >

                                Shop More

                            </a>

                        </div>

                    `;


                    ordersList.appendChild(
                        orderBox
                    );

                });

            })


            /* ================= ERROR ================= */

            .catch(error => {

                console.error(error);

                orderCount.textContent =
                    "Unable to load";

                ordersList.innerHTML = `

                    <div class="message">

                        <h2>
                            Unable to Load Orders
                        </h2>

                        <p>
                            Please make sure the
                            ArshuMart backend is running.
                        </p>

                    </div>

                `;

            });

        }

    </script>

</body>
</html>
